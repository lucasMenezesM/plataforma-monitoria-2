default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: lucasm

development:
  <<: *default
  database: plataforma_monitoria_development

test:
  <<: *default
  database: plataforma_monitoria_test

production:
  <<: *default
  database: plataforma_monitoria_production
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>